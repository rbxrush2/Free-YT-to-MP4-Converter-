<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube → MP4 Converter</title>

  <style>
    body {
      background: #060714;
      color: #fff;
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 0 16px;
    }

    .box {
      background: #111324;
      padding: 28px 24px;
      border-radius: 18px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.45);
      width: 100%;
      max-width: 420px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
    }

    .back-btn {
      position: absolute;
      top: -50px;
      left: 0;
      font-size: 0.9rem;
      padding: 8px 14px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: 0.15s;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    h1 {
      margin-bottom: 8px;
      font-size: 1.6rem;
      font-weight: 700;
    }

    p {
      opacity: 0.8;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: none;
      outline: none;
      font-size: 0.95rem;
      margin-bottom: 18px;
      background: #fff;
      color: #000;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #ff3b3b, #ff9b3b);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(255, 80, 80, 0.4);
      transition: 0.15s;
    }

    button:hover {
      opacity: 0.85;
      transform: translateY(-2px);
    }

    #result {
      margin-top: 24px;
      font-size: 0.95rem;
      min-height: 20px;
    }

    .loading {
      opacity: 0.75;
    }
  </style>
</head>

<body>
  <div class="box">

    <!-- BACK BUTTON -->
    <a href="index.html" class="back-btn">⬅ Back</a>

    <h1>YouTube → MP4</h1>
    <p>Paste your YouTube video link below:</p>

    <input id="yturl" type="text" placeholder="https://youtube.com/watch?v=xxxx" />

    <button onclick="startConvert()">Convert</button>

    <div id="result"></div>
  </div>

  <script>
    function startConvert() {
      const url = document.getElementById("yturl").value.trim();
      const resultBox = document.getElementById("result");

      if (!url) {
        resultBox.innerHTML =
          "<p style='color:#ff6b6b'>⚠️ Please enter a valid YouTube URL.</p>";
        return;
      }

      // TEMP MESSAGE — real API coming in Step 3
      resultBox.innerHTML =
        "<p class='loading'>⏳ Checking video… (API connection coming next)</p>";
    }
  </script>

</body>
</html>
